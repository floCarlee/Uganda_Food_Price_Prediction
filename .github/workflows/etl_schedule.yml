name: Run ETL Pipeline

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pandas numpy

      - name: Run ETL pipeline
        run: |
          python src/etl_pipeline.py